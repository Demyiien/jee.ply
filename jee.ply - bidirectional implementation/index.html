<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jee.ply</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Full-screen map -->
  <div id="map"></div>

  <!-- Pin mode banner (shown over map) -->
  <div id="pin-hint">
    <span id="pin-hint-text">Tap on the map to pin location</span>
    <button id="pin-cancel-btn">✕ Cancel</button>
  </div>

  <!-- Floating app label shown on map when sheet is peeked -->
  <div id="map-logo">
    <span class="logo-text">Jee.ply</span>
    <span class="logo-sub">Cebu Jeepney Routes</span>
  </div>

  <!-- Manong AI Chathead UI -->
  <div id="manong-chat-container">
    <!-- Chat Window (Hidden by default) -->
    <div id="manong-chat-window" class="hidden">
      <div id="manong-chat-header">
        <div class="header-info">
          <span class="chat-title">Manong AI</span>
          <span class="chat-status">Online</span>
        </div>
        <button id="manong-close-btn" title="Close">✕</button>
      </div>
      
      <div id="manong-chat-messages">
        <div class="chat-bubble ai-bubble">
          Boss! Asa ta moadto? (Where are we going?) Type a location or ask me about routes.
        </div>
      </div>
      
      <div id="manong-chat-input-area">
        <input type="text" id="manong-chat-input" placeholder="Ask Manong..." autocomplete="off" />
        <button id="manong-send-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>

    <!-- The Chathead Icon -->
    <div id="manong-chathead">
      <img src="icons/manong-driver.png" alt="Manong AI" draggable="false">
    </div>
  </div>

  <!-- Bottom Sheet -->
  <div id="bottom-sheet">

    <!-- Drag handle -->
    <div id="sheet-handle-area">
      <div id="sheet-handle"></div>
    </div>

    <!-- Sheet header (always visible in mid state) -->
    <div id="sheet-header">
      <div id="header-title">Jee.ply</div>
      <div id="header-sub">Cebu City Jeepney Route Finder</div>
    </div>

    <!-- Search panel -->
    <div id="panel">

      <div class="field-group" id="waypoints-group">
        <div class="field-row" id="origin-row">
          <div class="field-badge badge-a">A</div>
          <input type="text" id="origin-input" placeholder="Pick-up location…" autocomplete="off" />
          <button class="pin-btn" id="pin-origin-btn" title="Pin on map">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </button>
          <div class="suggestions" id="origin-suggestions" style="display:none"></div>
        </div>

        <div class="field-divider">
          <div class="field-divider-dots">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="field-row" id="dest-row">
          <div class="field-badge badge-b">B</div>
          <input type="text" id="dest-input" placeholder="Destination…" autocomplete="off" />
          <button class="pin-btn" id="pin-dest-btn" title="Pin on map">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </button>
          <div class="suggestions" id="dest-suggestions" style="display:none"></div>
        </div>
      </div>

      <div class="action-buttons">
        <button id="add-detour-btn">Add Detour</button>
        <button id="go-btn">Route Trip</button>
      </div>
      
    </div>

    <!-- Scrollable results area -->
    <div id="sheet-body">
      <div id="status-bar"></div>
      <div id="results"></div>
    </div>

  </div><!-- /bottom-sheet -->
</div>

<!-- Data files -->
<script src="coordinates.js"></script>
<script src="routes.js"></script>
<script src="landmarks.js"></script>

<!-- Logic -->
<script src="functions.js"></script>

<!-- App / UI -->
<script src="app.js"></script>

</body>
</html>
