<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jee.ply</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Full-screen map -->
  <div id="map"></div>

  <!-- Pin mode banner (shown over map) -->
  <div id="pin-hint">
    <span id="pin-hint-text">Tap on the map to pin location</span>
    <button id="pin-cancel-btn">✕ Cancel</button>
  </div>

  <!-- Floating app label shown on map when sheet is peeked -->
  <div id="map-logo">
    <span class="logo-text">Jee.ply</span>
    <span class="logo-sub">Cebu Jeepney Routes</span>
  </div>

  <!-- Manong AI Chathead UI -->
  <div id="manong-chat-container">
    <!-- Chat Window (Hidden by default) -->
    <div id="manong-chat-window" class="hidden">
      <div id="manong-chat-header">
        <div class="header-info">
          <span class="chat-title">Manong AI</span>
          <span class="chat-status">Online</span>
        </div>
      </div>
      
      <div id="manong-chat-messages">
        <div class="chat-bubble ai-bubble">
          Boss! Asa ta moadto? (Where are we going?) Type a location or ask me about routes.
        </div>
      </div>
      
      <div id="manong-chat-input-area">
        <input type="text" id="manong-chat-input" placeholder="Ask Manong..." autocomplete="off" />
        <button id="manong-send-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>

    <!-- The Chathead Icon -->
    <div id="manong-chathead">
      <img src="icons/manong-driver.png" alt="Manong AI" draggable="false">
    </div>
  </div>

  <div id="bottom-sheet">

    <div id="sheet-handle-area">
      <div id="sheet-handle"></div>
    </div>

    <div id="panel">
      <!-- NEW: Floating Error Bubble -->
      <div id="error-bubble"></div>
      <div class="field-group" id="waypoints-group">
        <div class="field-row card-beige" id="origin-row">
          <div class="field-badge badge-start">S</div>
          <input type="text" id="origin-input" placeholder="Start location…" autocomplete="off" />
          <button class="pin-btn" id="gps-origin-btn" title="Use current location">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path d="M12 2a10 10 0 1 0 10 10"/></svg>
          </button>
          <button class="pin-btn" id="pin-origin-btn" title="Pin on map">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </button>
          <div class="suggestions" id="origin-suggestions" style="display:none"></div>
        </div>

        <div class="field-row card-beige" id="dest-row">
          <div class="field-badge badge-start">E</div>
          <input type="text" id="dest-input" placeholder="End location…" autocomplete="off" />
          <button class="pin-btn" id="pin-dest-btn" title="Pin on map">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </button>
          <div class="suggestions" id="dest-suggestions" style="display:none"></div>
        </div>
      </div>

      <div class="action-buttons">
        <button id="add-detour-btn" class="btn-secondary">Add Detour</button>
        <button id="go-btn" class="btn-primary">Route Trip</button>
      </div>
    </div>

    <div id="builder-panel" class="hidden">
      <div id="builder-header"></div>
      <div id="builder-results"></div>
    </div>

    <!-- Loading overlay shown while route geometry is being plotted -->
    <div id="loading-overlay" class="hidden">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <div class="loading-title">Preparing route...</div>
        <div class="loading-sub">Please wait</div>
      </div>
    </div>

    <!-- Active trip panel: itinerary cards + End Trip button -->
    <div id="active-trip-panel" class="hidden">
      <div id="active-trip-itinerary"></div>
      <div class="active-trip-footer">
        <div class="active-trip-stats">
          <div class="active-stat">
            <span class="active-stat-label">Trips</span>
            <span class="active-stat-val" id="active-sum-trips">—</span>
          </div>
          <div class="active-stat-divider"></div>
          <div class="active-stat">
            <span class="active-stat-label">Time</span>
            <span class="active-stat-val" id="active-sum-time">—</span>
          </div>
          <div class="active-stat-divider"></div>
          <div class="active-stat">
            <span class="active-stat-label">Distance</span>
            <span class="active-stat-val" id="active-sum-dist">—</span>
          </div>
        </div>
        <button id="end-trip-btn" class="btn-end-trip">End Trip</button>
      </div>
    </div>

    <div id="sheet-body">
      <div id="status-bar"></div>
      <div id="results"></div>
    </div>

    <div id="summary-footer" class="hidden">

      <!-- Itinerary timeline — injected by showTripSummary() -->
      <div id="summary-itinerary"></div>

      <!-- Stats + actions -->
      <div class="summary-divider"></div>

      <div class="summary-stats">
        <div class="summary-stat-row">
          <span class="stat-label">Number of Trips</span>
          <span id="sum-trips" class="stat-val">0 trips</span>
        </div>
        <div class="summary-stat-row">
          <span class="stat-label">Travel Time</span>
          <span id="sum-time" class="stat-val">0 mins</span>
        </div>
        <div class="summary-stat-row">
          <span class="stat-label">Kilometers Travelled</span>
          <span id="sum-dist" class="stat-val">0 km</span>
        </div>
      </div>

      <div class="summary-divider"></div>

      <div class="summary-actions">
        <button id="builder-back-btn" class="btn-secondary">Back</button>
        <button id="start-trip-btn" class="btn-primary">
          <span>Start Trip</span>
          <span class="btn-divider">|</span>
          <span id="sum-fare">₱0.00</span>
        </button>
      </div>

    </div>

  </div>
</div>

<!-- Data files -->
<script src="coordinates.js"></script>
<script src="routes.js"></script>
<script src="landmarks.js"></script>

<!-- Logic -->
<script src="functions.js"></script>

<!-- App / UI -->
<script src="app.js"></script>

<!-- Manong AI -->
 <script src="manong.js"></script>

</body>
</html>
