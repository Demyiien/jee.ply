<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Jee.ply</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link rel="stylesheet" href="./styles/jeepneys.css" />
    <link rel="stylesheet" href="./styles/index.css" />
</head>
<body>
    <div id="map"></div>
    <div id="bottom-ui">
        <div class="travel-info">
            <div class="stop" id="start-input">
                <div class="icon">S</div>
                <div class="point-info" id="start-info">
                    <textarea name="start" id="start-add" class="address-input"></textarea>
                    <p class="address"><!-- INPUT SCRAPED ADDRESS HERE --></p>
                </div>
            </div>
            <div class="stop" id="end-input">
                <div class="icon">E</div>
                <div class="point-info" id="end-info">
                    <textarea name="end" id="end-add" class="address-input"></textarea>
                    <button class="pin-btn" id="pin-dest-btn" title="Pin destination on map"></button>
                    <div class="suggestions" id="dest-suggestions" style="display:none"></div>
                    <p class="address"><!-- INPUT SCRAPED ADDRESS HERE --></p>
                </div>
            </div>
            <div class="cta-group">
                <button class="cta">Add Detour</button>
                <button class="cta primary">Route Trip</button>
            </div>
        </div>
    </div>

    <!-- Data -->
    <script src="coordinates.js"></script>
    <script src="routes.js"></script>
    <script src="landmarks.js"></script>

    <!-- Logic -->
    <script src="functions.js"></script>

    <!-- App / UI -->
    <script src="app.js"></script>

</body>
</html>
